<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>You're Offline | SanIE Finance Manager</title>
    <link rel="icon" href="assets/favicon/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-bs-theme', 'dark');
            }
        } catch (error) {}
    </script>
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(1.5rem, env(safe-area-inset-top, 0px)) max(1.5rem, env(safe-area-inset-right, 0px)) max(1.5rem, env(safe-area-inset-bottom, 0px)) max(1.5rem, env(safe-area-inset-left, 0px)); color: #0f172a; background: linear-gradient(135deg, #ecfdf5, #f8fafc); }
        main { width: min(100%, 30rem); padding: 2rem; text-align: center; background: #fff; border: 1px solid #dbe4ee; border-radius: 1.25rem; box-shadow: 0 18px 45px rgba(15, 23, 42, .12); }
        img { width: 5rem; height: 5rem; border-radius: 1rem; }
        .status { display: inline-flex; align-items: center; gap: .45rem; margin-top: 1rem; padding: .4rem .75rem; color: #92400e; background: #fef3c7; border-radius: 999px; font-size: .875rem; font-weight: 700; }
        .status::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: #f59e0b; }
        h1 { margin: 1rem 0 .35rem; font-size: clamp(1.65rem, 5vw, 2.1rem); }
        h2 { margin: 0 0 .75rem; color: #059669; font-size: 1.15rem; }
        p { margin: 0 auto 1.5rem; max-width: 24rem; color: #64748b; line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
        button, a { min-height: 2.75rem; padding: .75rem 1.1rem; border-radius: .75rem; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
        button { color: #fff; background: #059669; border: 1px solid #059669; }
        a { color: #0f172a; background: #fff; border: 1px solid #cbd5e1; }
        button:focus-visible, a:focus-visible { outline: 3px solid rgba(16, 185, 129, .35); outline-offset: 2px; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-bs-theme="light"]) body { color: #f8fafc; background: linear-gradient(135deg, #0f172a, #111827); }
            :root:not([data-bs-theme="light"]) main { background: #111827; border-color: #334155; box-shadow: 0 18px 45px rgba(0, 0, 0, .35); }
            :root:not([data-bs-theme="light"]) p { color: #cbd5e1; }
            :root:not([data-bs-theme="light"]) a { color: #f8fafc; background: #1e293b; border-color: #475569; }
        }
        :root[data-bs-theme="dark"] body { color: #f8fafc; background: linear-gradient(135deg, #0f172a, #111827); }
        :root[data-bs-theme="dark"] main { background: #111827; border-color: #334155; box-shadow: 0 18px 45px rgba(0, 0, 0, .35); }
        :root[data-bs-theme="dark"] p { color: #cbd5e1; }
        :root[data-bs-theme="dark"] a { color: #f8fafc; background: #1e293b; border-color: #475569; }
    </style>
</head>
<body>
    <main>
        <img src="assets/icons/icon-192.png" alt="SanIE">
        <div class="status" role="status">Offline</div>
        <h1>SanIE Finance Manager</h1>
        <h2>You're offline</h2>
        <p>Some features need an internet connection. Previously available content may still be accessible.</p>
        <div class="actions">
            <button type="button" onclick="window.location.reload()">Retry connection</button>
            <a href="./#dashboard">Go to Home</a>
        </div>
    </main>
</body>
</html>
