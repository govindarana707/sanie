<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800" role="img" aria-labelledby="title desc">
  <title id="title">SanIE UML Use Case Diagram</title>
  <desc id="desc">UML use case diagram for the implemented SanIE personal finance management system. Guest and authenticated user actors are outside the system boundary. The authenticated user is repeated on both sides for readability. An email delivery service actor supports password recovery.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .boundary { fill: #fbfcfe; stroke: #111827; stroke-width: 4; }
      .uc { fill: #ffffff; stroke: #1f2937; stroke-width: 3; }
      .assoc { fill: none; stroke: #374151; stroke-width: 2.5; stroke-linecap: round; }
      .dependency { fill: none; stroke: #374151; stroke-width: 2.5; stroke-dasharray: 12 9; }
      .actor { fill: #ffffff; stroke: #111827; stroke-width: 4; stroke-linecap: round; }
      .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .section { font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 2.2px; fill: #475569; }
      .ucText { font: 500 23px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .actorText { font: 600 21px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .stereo { font: italic 20px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .note { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .divider { stroke: #cbd5e1; stroke-width: 2; }
    </style>
    <marker id="openArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect class="page" x="0" y="0" width="2600" height="1800"/>

  <!-- System boundary -->
  <rect class="boundary" x="380" y="50" width="1840" height="1680" rx="2"/>
  <rect x="410" y="31" width="688" height="46" fill="#fbfcfe"/>
  <text class="title" x="425" y="64">SanIE – Personal Finance Management System</text>

  <!-- Domain labels (visual grouping only; not nested system boundaries) -->
  <text class="section" x="430" y="112">ACCOUNT ACCESS</text>
  <line class="divider" x1="430" y1="445" x2="2170" y2="445"/>
  <text class="section" x="430" y="492">AUTHENTICATED PERSONAL FINANCE WORKSPACE</text>

  <!-- Associations are drawn before actors and use cases so shapes remain clean -->
  <!-- Guest associations -->
  <path class="assoc" d="M 220 238 L 720 150"/>
  <path class="assoc" d="M 220 260 L 720 280"/>
  <path class="assoc" d="M 220 282 L 720 410"/>

  <!-- Email service association -->
  <path class="assoc" d="M 1880 410 L 2380 410"/>

  <!-- Authenticated user associations: left representation -->
  <path class="assoc" d="M 220 1040 L 720 580"/>
  <path class="assoc" d="M 220 1050 L 720 730"/>
  <path class="assoc" d="M 220 1060 L 720 880"/>
  <path class="assoc" d="M 220 1070 L 720 1030"/>
  <path class="assoc" d="M 220 1080 L 720 1180"/>
  <path class="assoc" d="M 220 1090 L 720 1330"/>
  <path class="assoc" d="M 220 1100 L 720 1480"/>
  <path class="assoc" d="M 220 1110 L 720 1620"/>

  <!-- Authenticated user associations: repeated right representation -->
  <path class="assoc" d="M 1880 580 L 2380 1040"/>
  <path class="assoc" d="M 1880 730 L 2380 1050"/>
  <path class="assoc" d="M 1880 880 L 2380 1060"/>
  <path class="assoc" d="M 1880 1030 L 2380 1070"/>
  <path class="assoc" d="M 1880 1180 L 2380 1080"/>
  <path class="assoc" d="M 1880 1330 L 2380 1090"/>
  <path class="assoc" d="M 1880 1480 L 2380 1100"/>

  <!-- UML include dependency: Recover Password includes reset-link delivery -->
  <path class="dependency" d="M 1240 410 L 1360 410" marker-end="url(#openArrow)"/>
  <rect x="1230" y="365" width="140" height="31" fill="#fbfcfe"/>
  <text class="stereo" x="1300" y="389">«include»</text>

  <!-- Use cases: account access -->
  <ellipse class="uc" cx="980" cy="150" rx="260" ry="48"/>
  <text class="ucText" x="980" y="158">Register Account</text>

  <ellipse class="uc" cx="980" cy="280" rx="260" ry="48"/>
  <text class="ucText" x="980" y="288">Log In</text>

  <ellipse class="uc" cx="980" cy="410" rx="260" ry="48"/>
  <text class="ucText" x="980" y="418">Recover Password</text>

  <ellipse class="uc" cx="1620" cy="410" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="418">Send Password Reset Link</text>

  <!-- Use cases: finance workspace, left column -->
  <ellipse class="uc" cx="980" cy="580" rx="260" ry="48"/>
  <text class="ucText" x="980" y="588">View Financial Dashboard</text>

  <ellipse class="uc" cx="980" cy="730" rx="260" ry="48"/>
  <text class="ucText" x="980" y="738">Manage Transactions</text>

  <ellipse class="uc" cx="980" cy="880" rx="260" ry="48"/>
  <text class="ucText" x="980" y="873">Manage Recurring</text>
  <text class="ucText" x="980" y="902">Transactions</text>

  <ellipse class="uc" cx="980" cy="1030" rx="260" ry="48"/>
  <text class="ucText" x="980" y="1023">Manage Savings Goals</text>
  <text class="ucText" x="980" y="1052">and Contributions</text>

  <ellipse class="uc" cx="980" cy="1180" rx="260" ry="48"/>
  <text class="ucText" x="980" y="1173">Analyze Financial Health</text>
  <text class="ucText" x="980" y="1202">and Trends</text>

  <ellipse class="uc" cx="980" cy="1330" rx="260" ry="48"/>
  <text class="ucText" x="980" y="1323">Manage Karobar People</text>
  <text class="ucText" x="980" y="1352">and Credit/Debt</text>

  <ellipse class="uc" cx="980" cy="1480" rx="260" ry="48"/>
  <text class="ucText" x="980" y="1473">Manage Tasks and</text>
  <text class="ucText" x="980" y="1502">Board Study Plan</text>

  <ellipse class="uc" cx="980" cy="1620" rx="260" ry="48"/>
  <text class="ucText" x="980" y="1613">Manage Profile, Security</text>
  <text class="ucText" x="980" y="1642">and Preferences</text>

  <!-- Use cases: finance workspace, right column -->
  <ellipse class="uc" cx="1620" cy="580" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="573">Manage Accounts</text>
  <text class="ucText" x="1620" y="602">and Statements</text>

  <ellipse class="uc" cx="1620" cy="730" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="723">Manage Categories</text>
  <text class="ucText" x="1620" y="752">and Subcategories</text>

  <ellipse class="uc" cx="1620" cy="880" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="888">Manage Budgets</text>

  <ellipse class="uc" cx="1620" cy="1030" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="1038">Review Savings Overview</text>

  <ellipse class="uc" cx="1620" cy="1180" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="1173">View and Export</text>
  <text class="ucText" x="1620" y="1202">Financial Reports</text>

  <ellipse class="uc" cx="1620" cy="1330" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="1323">View Karobar Reports</text>
  <text class="ucText" x="1620" y="1352">and Analysis</text>

  <ellipse class="uc" cx="1620" cy="1480" rx="260" ry="48"/>
  <text class="ucText" x="1620" y="1488">Manage Notifications</text>

  <!-- Actor: Guest -->
  <g aria-label="Guest actor">
    <circle class="actor" cx="170" cy="165" r="34"/>
    <line class="actor" x1="170" y1="199" x2="170" y2="285"/>
    <line class="actor" x1="105" y1="230" x2="235" y2="230"/>
    <line class="actor" x1="170" y1="285" x2="110" y2="355"/>
    <line class="actor" x1="170" y1="285" x2="230" y2="355"/>
    <text class="actorText" x="170" y="392">Guest</text>
  </g>

  <!-- Actor: Authenticated User (left) -->
  <g aria-label="Authenticated User actor, left representation">
    <circle class="actor" cx="170" cy="900" r="34"/>
    <line class="actor" x1="170" y1="934" x2="170" y2="1020"/>
    <line class="actor" x1="105" y1="965" x2="235" y2="965"/>
    <line class="actor" x1="170" y1="1020" x2="110" y2="1090"/>
    <line class="actor" x1="170" y1="1020" x2="230" y2="1090"/>
    <text class="actorText" x="170" y="1130">Authenticated</text>
    <text class="actorText" x="170" y="1157">User</text>
  </g>

  <!-- Actor: Email Delivery Service -->
  <g aria-label="Email Delivery Service actor">
    <circle class="actor" cx="2430" cy="285" r="34"/>
    <line class="actor" x1="2430" y1="319" x2="2430" y2="405"/>
    <line class="actor" x1="2365" y1="350" x2="2495" y2="350"/>
    <line class="actor" x1="2430" y1="405" x2="2370" y2="475"/>
    <line class="actor" x1="2430" y1="405" x2="2490" y2="475"/>
    <text class="actorText" x="2430" y="515">Email Delivery</text>
    <text class="actorText" x="2430" y="542">Service</text>
  </g>

  <!-- Actor: Authenticated User (right, repeated to reduce crossings) -->
  <g aria-label="Authenticated User actor, repeated right representation">
    <circle class="actor" cx="2430" cy="900" r="34"/>
    <line class="actor" x1="2430" y1="934" x2="2430" y2="1020"/>
    <line class="actor" x1="2365" y1="965" x2="2495" y2="965"/>
    <line class="actor" x1="2430" y1="1020" x2="2370" y2="1090"/>
    <line class="actor" x1="2430" y1="1020" x2="2490" y2="1090"/>
    <text class="actorText" x="2430" y="1130">Authenticated</text>
    <text class="actorText" x="2430" y="1157">User</text>
    <text class="note" x="2328" y="1190">(same actor, repeated for clarity)</text>
  </g>
</svg>
